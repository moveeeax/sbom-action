name: "sbom-action"
description: "Generate an SBOM with Syft (SPDX/CycloneDX), gate on missing licenses, sign with Cosign, and attach it to the GitHub Release."
branding:
  icon: "package"
  color: "purple"

inputs:
  artifact:
    description: "Path or reference to scan (directory, file, or image ref)."
    required: false
    default: "."
  source-type:
    description: "How to interpret `artifact`: dir | file | image | docker."
    required: false
    default: "dir"
  format:
    description: "SBOM format: cyclonedx-json | cyclonedx-xml | spdx-json | spdx-tag-value | syft-json | table."
    required: false
    default: "cyclonedx-json"
  output:
    description: "Output file path. Defaults to sbom.<ext> derived from the format."
    required: false
    default: ""
  fail-on-missing-license:
    description: "Fail the run if any component lacks license metadata."
    required: false
    default: "false"
  license-allow:
    description: "SPDX license ids allowed for components, comma- or newline-separated (e.g. MIT, Apache-2.0). When set, any other license fails the run."
    required: false
    default: ""
  license-deny:
    description: "SPDX license ids that fail the run, comma- or newline-separated (e.g. AGPL-3.0-only). Deny wins over allow for the same id."
    required: false
    default: ""
  license-exceptions:
    description: "Per-component waivers for the license policy, one per line: `<name>[@<version>] <YYYY-MM-DD> [reason]`. A waiver stops applying after its date."
    required: false
    default: ""
  allow-unknown-license:
    description: "Let components pass the license policy when their license is missing or is not a SPDX id (LicenseRef-*, free text)."
    required: false
    default: "false"
  fail-on-license-mismatch:
    description: "Fail when a component's declared license differs from the license Syft concluded from its files. Mismatches are always reported."
    required: false
    default: "false"
  upload-release:
    description: "Attach the SBOM to the release when the workflow runs on a tag."
    required: false
    default: "true"
  sign:
    description: "Sign the SBOM with Cosign (keyless) and attach the Sigstore bundle (<sbom>.sigstore.json)."
    required: false
    default: "false"
  syft-version:
    description: "Syft version to install (e.g. v1.56.0)."
    required: false
    default: "v1.56.0"
  cosign-version:
    description: "Cosign version to install when sign=true (e.g. v3.1.4)."
    required: false
    default: "v3.1.4"
  github-token:
    description: "Token used to upload the SBOM to the release."
    required: false
    default: ${{ github.token }}

outputs:
  sbom-path:
    description: "Path to the generated SBOM file."
    value: ${{ steps.sbom.outputs.sbom-path }}
  format:
    description: "Canonical Syft format that was produced."
    value: ${{ steps.sbom.outputs.format }}
  missing-license-count:
    description: "Number of components missing license metadata (0 unless the gate ran)."
    value: ${{ steps.sbom.outputs.missing-license-count }}
  license-violation-count:
    description: "Number of components failing the license policy, waivers excluded (0 unless the policy ran)."
    value: ${{ steps.sbom.outputs.license-violation-count }}
  license-mismatch-count:
    description: "Number of components whose declared and concluded licenses differ (0 unless the policy ran)."
    value: ${{ steps.sbom.outputs.license-mismatch-count }}
  license-report-path:
    description: "Path to the JSON license policy report (<sbom>.license-report.json) when the policy ran, empty otherwise."
    value: ${{ steps.sbom.outputs.license-report-path }}
  bundle-path:
    description: "Path to the Sigstore bundle (signature + certificate) when sign=true, empty otherwise."
    value: ${{ steps.sign.outputs.bundle-path }}

runs:
  using: "composite"
  steps:
    - name: Install Syft
      shell: bash
      env:
        SYFT_VERSION: ${{ inputs.syft-version }}
      run: |
        set -euo pipefail
        ver="${SYFT_VERSION#v}"
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "sbom-action: unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        bin="${RUNNER_TEMP}/sbom-bin"
        tmp="$(mktemp -d)"
        base="https://github.com/anchore/syft/releases/download/v${ver}"
        tarball="syft_${ver}_linux_${arch}.tar.gz"
        curl -sSfL -o "${tmp}/${tarball}" "${base}/${tarball}"
        curl -sSfL -o "${tmp}/checksums.txt" "${base}/syft_${ver}_checksums.txt"
        (cd "$tmp" && grep -E "  ${tarball}\$" checksums.txt | sha256sum -c -)
        mkdir -p "$bin"
        tar -xzf "${tmp}/${tarball}" -C "$tmp" syft
        install -m 0755 "${tmp}/syft" "${bin}/syft"
        rm -rf "$tmp"
        echo "$bin" >> "$GITHUB_PATH"
        "${bin}/syft" version

    - name: Install Cosign
      if: inputs.sign == 'true'
      shell: bash
      env:
        COSIGN_VERSION: ${{ inputs.cosign-version }}
      run: |
        set -euo pipefail
        ver="v${COSIGN_VERSION#v}"
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "sbom-action: unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        bin="${RUNNER_TEMP}/sbom-bin"
        tmp="$(mktemp -d)"
        base="https://github.com/sigstore/cosign/releases/download/${ver}"
        asset="cosign-linux-${arch}"
        curl -sSfL -o "${tmp}/${asset}" "${base}/${asset}"
        curl -sSfL -o "${tmp}/checksums.txt" "${base}/cosign_checksums.txt"
        (cd "$tmp" && grep -E "  ${asset}\$" checksums.txt | sha256sum -c -)
        mkdir -p "$bin"
        install -m 0755 "${tmp}/${asset}" "${bin}/cosign"
        rm -rf "$tmp"
        "${bin}/cosign" version

    - name: Generate SBOM
      id: sbom
      shell: bash
      env:
        INPUT_ARTIFACT: ${{ inputs.artifact }}
        INPUT_SOURCE_TYPE: ${{ inputs.source-type }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_FAIL_ON_MISSING_LICENSE: ${{ inputs.fail-on-missing-license }}
        INPUT_LICENSE_ALLOW: ${{ inputs.license-allow }}
        INPUT_LICENSE_DENY: ${{ inputs.license-deny }}
        INPUT_LICENSE_EXCEPTIONS: ${{ inputs.license-exceptions }}
        INPUT_ALLOW_UNKNOWN_LICENSE: ${{ inputs.allow-unknown-license }}
        INPUT_FAIL_ON_LICENSE_MISMATCH: ${{ inputs.fail-on-license-mismatch }}
      run: |
        set -euo pipefail
        "${GITHUB_ACTION_PATH}/scripts/generate-sbom.sh"

    - name: Sign SBOM
      id: sign
      if: inputs.sign == 'true'
      shell: bash
      env:
        SBOM_PATH: ${{ steps.sbom.outputs.sbom-path }}
      run: |
        set -euo pipefail
        bundle="${SBOM_PATH}.sigstore.json"
        "${RUNNER_TEMP}/sbom-bin/cosign" sign-blob --yes --bundle "$bundle" "$SBOM_PATH"
        echo "bundle-path=${bundle}" >> "$GITHUB_OUTPUT"

    - name: Attach SBOM to release
      if: inputs.upload-release == 'true' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SBOM_PATH: ${{ steps.sbom.outputs.sbom-path }}
        BUNDLE_PATH: ${{ steps.sign.outputs.bundle-path }}
      run: |
        set -euo pipefail
        tag="${GITHUB_REF#refs/tags/}"
        assets=("$SBOM_PATH")
        [ -n "$BUNDLE_PATH" ] && [ -f "$BUNDLE_PATH" ] && assets+=("$BUNDLE_PATH")
        gh release upload "$tag" "${assets[@]}" --clobber
