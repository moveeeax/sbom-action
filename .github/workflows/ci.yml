name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats shellcheck jq

      - name: shellcheck
        run: shellcheck -x scripts/lib.sh scripts/generate-sbom.sh tests/fixtures/fake-syft

      - name: bats
        run: bats tests/

  self-test:
    # End-to-end: run the action against this repo with real Syft, and sign
    # the SBOM keyless with real Cosign when an OIDC token is available.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write # keyless Cosign signing
    env:
      # Pull requests from forks get no OIDC token, so signing is skipped there.
      CAN_SIGN: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM for this repo
        id: sbom
        uses: ./
        with:
          artifact: .
          format: cyclonedx-json
          upload-release: "false"
          sign: ${{ env.CAN_SIGN }}

      - name: Check the SBOM is valid JSON with components
        env:
          SBOM_PATH: ${{ steps.sbom.outputs.sbom-path }}
        run: |
          set -euo pipefail
          syft version
          jq -e '.components | length > 0' "$SBOM_PATH"

      - name: Verify the Sigstore bundle
        if: env.CAN_SIGN == 'true'
        env:
          SBOM_PATH: ${{ steps.sbom.outputs.sbom-path }}
          BUNDLE_PATH: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cosign version
          test -s "$BUNDLE_PATH"
          cosign verify-blob \
            --bundle "$BUNDLE_PATH" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$SBOM_PATH"

      - name: Run the license policy against this repo
        id: policy
        uses: ./
        with:
          artifact: .
          format: spdx-json
          output: policy-sbom.spdx.json
          upload-release: "false"
          license-deny: AGPL-3.0-only, GPL-3.0-only
          # Components Syft finds here (workflow actions) may carry no license metadata.
          allow-unknown-license: "true"

      - name: Check the license policy outputs
        env:
          REPORT: ${{ steps.policy.outputs.license-report-path }}
          VIOLATIONS: ${{ steps.policy.outputs.license-violation-count }}
        run: |
          set -euo pipefail
          test "$REPORT" = policy-sbom.spdx.json.license-report.json
          test "$VIOLATIONS" = 0
          jq -e '.violations == 0 and (.packages | length > 0)' "$REPORT"
